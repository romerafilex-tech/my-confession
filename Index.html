<!DOCTYPE html>
<html>
<head>
    <title>My Little Confession 💓</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #87CEEB;
            font-family: Arial, sans-serif;
        }

        /* =========================
           FLOWER BACKGROUND
        ========================= */

        .flower {
            position: absolute;
            font-size: 45px;
            animation: float 5s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes float {
            from {
                transform: translateY(0px) rotate(0deg);
            }

            to {
                transform: translateY(-40px) rotate(20deg);
            }
        }

        .f1  { left: 5%;  top: 10%; animation-delay: 0s; }
        .f2  { left: 20%; top: 5%;  animation-delay: 1s; }
        .f3  { left: 35%; top: 15%; animation-delay: 2s; }
        .f4  { left: 50%; top: 5%;  animation-delay: 3s; }
        .f5  { left: 65%; top: 15%; animation-delay: 1s; }
        .f6  { left: 80%; top: 5%;  animation-delay: 2s; }

        .f7  { left: 10%; top: 35%; animation-delay: 3s; }
        .f8  { left: 25%; top: 45%; animation-delay: 1s; }
        .f9  { left: 40%; top: 35%; animation-delay: 4s; }
        .f10 { left: 55%; top: 45%; animation-delay: 2s; }
        .f11 { left: 70%; top: 35%; animation-delay: 0s; }
        .f12 { left: 85%; top: 45%; animation-delay: 3s; }

        .f13 { left: 5%;  top: 70%; animation-delay: 2s; }
        .f14 { left: 20%; top: 80%; animation-delay: 4s; }
        .f15 { left: 35%; top: 65%; animation-delay: 1s; }
        .f16 { left: 50%; top: 80%; animation-delay: 3s; }
        .f17 { left: 65%; top: 65%; animation-delay: 0s; }
        .f18 { left: 80%; top: 80%; animation-delay: 2s; }


        /* =========================
           QUESTION BOX
        ========================= */

        .container {
            position: absolute;
            z-index: 10;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            background: rgba(255, 255, 255, 0.88);

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);

            min-width: 280px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #333;
        }


        /* =========================
           BUTTONS
        ========================= */

        button {
            padding: 12px 25px;

            font-size: 18px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            margin: 5px;
        }

        .yesButton {
            background: #3498db;
            color: white;
        }

        .noButton {
            background: white;
            color: #333;

            border: 2px solid #3498db;
        }


        /* =========================
           HIDE / SHOW
        ========================= */

        .hidden {
            display: none;
        }

    </style>
</head>

<body>


    <!-- FLOWERS -->

    <div class="flower f1">🌸</div>
    <div class="flower f2">🌸</div>
    <div class="flower f3">🌸</div>
    <div class="flower f4">🌸</div>
    <div class="flower f5">🌸</div>
    <div class="flower f6">🌸</div>

    <div class="flower f7">🌸</div>
    <div class="flower f8">🌸</div>
    <div class="flower f9">🌸</div>
    <div class="flower f10">🌸</div>
    <div class="flower f11">🌸</div>
    <div class="flower f12">🌸</div>

    <div class="flower f13">🌸</div>
    <div class="flower f14">🌸</div>
    <div class="flower f15">🌸</div>
    <div class="flower f16">🌸</div>
    <div class="flower f17">🌸</div>
    <div class="flower f18">🌸</div>


    <!-- =========================
         PHASE 2
    ========================= -->

    <div class="container" id="phase2">

        <h1>
            Would you be surprised if someone confessed to you?
        </h1>

        <button class="yesButton" id="yesButton">
            Yes
        </button>

        <button class="noButton" id="noButton">
            No
        </button>

    </div>


    <!-- =========================
         PHASE 3
    ========================= -->

    <div class="container hidden" id="phase3">

        <h1>
            If someone liked you, would you want to know?
        </h1>

        <button class="yesButton">
            Yes
        </button>

        <button class="noButton">
            No
        </button>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");

        const phase2 = document.getElementById("phase2");
        const phase3 = document.getElementById("phase3");


        /* =========================
           PHASE 2 — NO TELEPORTS
        ========================= */

        noButton.addEventListener("click", function() {

            const maxX =
                window.innerWidth - noButton.offsetWidth;

            const maxY =
                window.innerHeight - noButton.offsetHeight;

            const randomX =
                Math.random() * maxX;

            const randomY =
                Math.random() * maxY;

            noButton.style.position = "fixed";

            noButton.style.left = randomX + "px";

            noButton.style.top = randomY + "px";

        });


        /* =========================
           PHASE 2 — YES GOES TO PHASE 3
        ========================= */

        yesButton.addEventListener("click", function() {

            phase2.classList.add("hidden");

            phase3.classList.remove("hidden");

        });

    </script>

</body>
</html>
